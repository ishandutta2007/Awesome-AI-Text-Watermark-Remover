<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a" />
      <stop offset="50%" stop-color="#12182c" />
      <stop offset="100%" stop-color="#1a153a" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5">
        <animate attributeName="stop-color" values="#4f46e5;#06b6d4;#8b5cf6;#4f46e5" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#8b5cf6">
        <animate attributeName="stop-color" values="#8b5cf6;#ec4899;#06b6d4;#8b5cf6" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4;#4f46e5;#ec4899;#06b6d4" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="radarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </linearGradient>

    <!-- Filter for soft glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 800;
      font-size: 38px;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 500;
      font-size: 16px;
      fill: #cbd5e1;
      letter-spacing: 0.2px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 600;
      font-size: 11.5px;
      letter-spacing: 0.5px;
    }
    .grid-line {
      stroke: #334155;
      stroke-opacity: 0.18;
      stroke-width: 1;
    }
  </style>

  <!-- Background Base -->
  <rect width="920" height="280" rx="16" fill="url(#bgGrad)" stroke="#312e81" stroke-width="1.5" />

  <!-- Background Tech Grid Lines -->
  <line x1="60" y1="0" x2="60" y2="280" class="grid-line" />
  <line x1="180" y1="0" x2="180" y2="280" class="grid-line" />
  <line x1="300" y1="0" x2="300" y2="280" class="grid-line" />
  <line x1="420" y1="0" x2="420" y2="280" class="grid-line" />
  <line x1="540" y1="0" x2="540" y2="280" class="grid-line" />
  <line x1="660" y1="0" x2="660" y2="280" class="grid-line" />
  <line x1="780" y1="0" x2="780" y2="280" class="grid-line" />
  <line x1="0" y1="70" x2="920" y2="70" class="grid-line" />
  <line x1="0" y1="140" x2="920" y2="140" class="grid-line" />
  <line x1="0" y1="210" x2="920" y2="210" class="grid-line" />

  <!-- Dynamic Background Scanning Beam -->
  <rect x="0" y="0" width="220" height="280" fill="url(#radarGrad)">
    <animate attributeName="x" values="-220; 920" dur="6s" repeatCount="indefinite" />
  </rect>

  <!-- Dynamic Constellation / Particles in Background -->
  <g opacity="0.65">
    <!-- Pulsing Node 1 -->
    <circle cx="120" cy="50" r="3" fill="#06b6d4">
      <animate attributeName="r" values="2;4;2" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="210" cy="75" r="2.5" fill="#8b5cf6">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <line x1="120" y1="50" x2="210" y2="75" stroke="#4f46e5" stroke-opacity="0.3" stroke-dasharray="3,3" />

    <!-- Pulsing Node 2 -->
    <circle cx="820" cy="60" r="3.5" fill="#ec4899">
      <animate attributeName="r" values="2.5;5;2.5" dur="3.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="730" cy="85" r="2.5" fill="#06b6d4">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="4s" repeatCount="indefinite" />
    </circle>
    <line x1="820" y1="60" x2="730" y2="85" stroke="#8b5cf6" stroke-opacity="0.3" stroke-dasharray="3,3" />

    <!-- Pulsing Node 3 Bottom -->
    <circle cx="150" cy="230" r="3" fill="#8b5cf6">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="780" cy="225" r="3" fill="#06b6d4">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.8s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Animated Wave Lines (Safe bottom positioning behind text) -->
  <path d="M 0,250 Q 230,220 460,250 T 920,250" fill="none" stroke="url(#primaryGrad)" stroke-width="1.5" stroke-opacity="0.35">
    <animate attributeName="d" values="M 0,250 Q 230,220 460,250 T 920,250; M 0,250 Q 230,270 460,250 T 920,250; M 0,250 Q 230,220 460,250 T 920,250" dur="7s" repeatCount="indefinite" />
  </path>

  <!-- FOREGROUND LAYER: Content remains sharp and always visible -->
  
  <!-- Mini Header Tag / Pill -->
  <g transform="translate(325, 28)">
    <rect width="270" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
    <circle cx="16" cy="14" r="4.5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="30" y="18.5" fill="#a5b4fc" class="badge-text">CURATED RESEARCH &amp; TOOL DIRECTORY</text>
  </g>

  <!-- Main Title with Glowing Gradient Accent -->
  <text x="460" y="105" text-anchor="middle" fill="#ffffff" class="title" filter="url(#glow)">
    Awesome AI Text Watermark Remover
  </text>
  <text x="460" y="105" text-anchor="middle" fill="url(#primaryGrad)" class="title">
    Awesome AI Text Watermark Remover
  </text>

  <!-- Subtitle -->
  <text x="460" y="142" text-anchor="middle" class="subtitle">
    SaaS Platforms, Open-Source Repositories &amp; Detection Evasion Frameworks
  </text>

  <!-- Interactive / Floating Feature Pills in Safe Bottom Foreground -->
  <!-- Pill 1: Paraphrasing & Humanization -->
  <g transform="translate(115, 182)">
    <animateTransform attributeName="transform" type="translate" values="115,182; 115,178; 115,182" dur="4s" repeatCount="indefinite" />
    <rect width="200" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.95" />
    <text x="22" y="22.5" fill="#38bdf8" font-size="14">⚡</text>
    <text x="44" y="22" fill="#f1f5f9" class="badge-text">Paraphrase &amp; Humanize</text>
  </g>

  <!-- Pill 2: Watermark Neutralization -->
  <g transform="translate(340, 182)">
    <animateTransform attributeName="transform" type="translate" values="340,178; 340,182; 340,178" dur="4.5s" repeatCount="indefinite" />
    <rect width="240" height="36" rx="18" fill="#1e293b" stroke="#a855f7" stroke-width="1.2" opacity="0.95" />
    <text x="22" y="22.5" fill="#a855f7" font-size="14">🛡️</text>
    <text x="44" y="22" fill="#f1f5f9" class="badge-text">SynthID &amp; Statistical Scrub</text>
  </g>

  <!-- Pill 3: Detector Benchmarking -->
  <g transform="translate(605, 182)">
    <animateTransform attributeName="transform" type="translate" values="605,182; 605,178; 605,182" dur="3.8s" repeatCount="indefinite" />
    <rect width="200" height="36" rx="18" fill="#1e293b" stroke="#ec4899" stroke-width="1.2" opacity="0.95" />
    <text x="22" y="22.5" fill="#ec4899" font-size="14">🔍</text>
    <text x="44" y="22" fill="#f1f5f9" class="badge-text">Detector Evasion Metrics</text>
  </g>
</svg>
